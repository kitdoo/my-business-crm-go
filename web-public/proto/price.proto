syntax = "proto3";
package crm.grpc.price.v1;

import "google/protobuf/field_mask.proto";
import "common.proto";

// Mirrors proto/services/grpc/price/v1/price_service.proto and
// proto/types/price/product_price.proto on the backend. Not a generic
// EntityRegistry entity (TD §10/§12.1) — Get is keyed by skuId, not
// id, and it lives as a tab on the Product detail page, not its own list.

message ProductPrice {
  string id = 1;
  int64 createdAt = 2;
  int64 updatedAt = 3;
  optional int64 deletedAt = 4;
  string skuId = 5;
  // Basis points (amount * 100).
  int64 priceAmount = 6;
  // ISO 4217 code, e.g. "RSD". Not settable via Create/Update.
  string currency = 7;
  optional int64 discountAmount = 8;
  string etag = 101;
}

service PricesService {
  rpc Create (ProductPriceCreateRequest) returns (ProductPriceCreateResponse) {}
  rpc Get (ProductPriceGetRequest) returns (ProductPriceGetResponse) {}
  // List looks up the current price for a batch of SKUs in one round trip —
  // used by the public catalog (web-public/) to price a whole page of
  // products at once instead of one Get per SKU. Unlike Get, a SKU with no
  // current price is silently omitted from items rather than erroring.
  rpc List (ProductPriceListRequest) returns (ProductPriceListResponse) {}
  rpc Update (ProductPriceUpdateRequest) returns (ProductPriceUpdateResponse) {}
  rpc Delete (ProductPriceDeleteRequest) returns (ProductPriceDeleteResponse) {}
  rpc GetHistory (ProductPriceGetHistoryRequest) returns (ProductPriceGetHistoryResponse) {}
}

message ProductPriceGetRequest {
  string skuId = 1;
}

message ProductPriceGetResponse {
  ProductPrice price = 1;
}

message ProductPriceListRequest {
  message Filter {
    repeated string skuIds = 1;
  }
  Filter filter = 1;
}

message ProductPriceListResponse {
  repeated ProductPrice items = 1;
}

message ProductPriceCreateRequest {
  string skuId = 1;
  int64 priceAmount = 2;
  optional int64 discountAmount = 3;
}

message ProductPriceCreateResponse {
  ProductPrice price = 1;
}

message ProductPriceUpdateRequest {
  message Options {
    optional google.protobuf.FieldMask updateMask = 1;
    optional string etag = 2;
  }
  string id = 1;
  optional int64 priceAmount = 2;
  optional int64 discountAmount = 3;
  optional Options options = 99;
}

message ProductPriceUpdateResponse {
  ProductPrice price = 1;
}

message ProductPriceDeleteRequest {
  message Options {
    optional string etag = 1;
  }
  string id = 1;
  optional Options options = 99;
}

message ProductPriceDeleteResponse {}

message ProductPriceGetHistoryRequest {
  string skuId = 1;
  message Filter {
    optional crm.types.common.PeriodFilter createdAt = 1;
  }
  optional Filter filter = 2;
  optional crm.types.common.Pagination pagination = 3;
}

message ProductPriceGetHistoryResponse {
  repeated ProductPrice items = 1;
  optional string nextCursor = 2;
}
