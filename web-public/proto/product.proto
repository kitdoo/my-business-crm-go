syntax = "proto3";
package crm.grpc.product.v1;

import "google/protobuf/field_mask.proto";
import "common.proto";

// Mirrors proto/services/grpc/product/v1/product_service.proto and
// proto/types/product/product.proto on the backend. A catalog card
// grouping one or more ProductVariant — carries no sku, images, price, or
// stock; those live on ProductVariant/ProductPrice/Inventory.

message Product {
  string id = 1;
  int64 createdAt = 2;
  int64 updatedAt = 3;
  optional int64 deletedAt = 4;
  crm.types.common.LocalizedString name = 6;
  crm.types.common.LocalizedString description = 7;
  string brandId = 8;
  repeated string categoryIds = 9;
  // Characteristic name -> localized value, shared across every variant
  // (material, collection, ...).
  map<string, crm.types.common.LocalizedString> details = 10;
  ProductStatus status = 12;
  string etag = 101;
}

enum ProductStatus {
  PRODUCT_STATUS_UNSPECIFIED = 0;
  PRODUCT_STATUS_DRAFT = 1;
  PRODUCT_STATUS_ACTIVE = 2;
  PRODUCT_STATUS_INACTIVE = 3;
}

service ProductsService {
  rpc Create (ProductCreateRequest) returns (ProductCreateResponse) {}
  rpc Get (ProductGetRequest) returns (ProductGetResponse) {}
  rpc List (ProductsListRequest) returns (ProductsListResponse) {}
  rpc Update (ProductUpdateRequest) returns (ProductUpdateResponse) {}
  rpc Delete (ProductDeleteRequest) returns (ProductDeleteResponse) {}
}

message ProductGetRequest {
  message Options {
    optional google.protobuf.FieldMask readMask = 1;
  }
  string id = 1;
  optional Options options = 99;
}

message ProductGetResponse {
  Product product = 1;
}

message ProductsListRequest {
  optional string brandId = 1;
  optional string categoryId = 2;
  message Sort {
    enum Field {
      FIELD_CREATED_AT = 0;
      FIELD_NAME = 1;
    }
    Field field = 1;
    crm.types.common.SortDirection direction = 2;
  }
  optional Sort sort = 3;
  optional crm.types.common.Pagination pagination = 4;
  message Filter {
    repeated ProductStatus statuses = 1;
    optional string searchQuery = 2;
    repeated string brandIds = 3;
    repeated string categoryIds = 4;
    optional crm.types.common.PeriodFilter createdAt = 6;
    repeated string ids = 7;
  }
  optional Filter filter = 5;
  message Options {
    optional google.protobuf.FieldMask readMask = 1;
    bool includeTotalCount = 2;
  }
  optional Options options = 99;
}

message ProductsListResponse {
  repeated Product items = 1;
  optional int64 total = 2;
  optional string nextCursor = 3;
}

message ProductCreateRequest {
  message Options {
    optional google.protobuf.FieldMask readMask = 1;
  }
  crm.types.common.LocalizedString name = 2;
  crm.types.common.LocalizedString description = 3;
  string brandId = 4;
  repeated string categoryIds = 5;
  map<string, crm.types.common.LocalizedString> details = 6;
  optional Options options = 99;
}

message ProductCreateResponse {
  Product product = 1;
}

// sku is immutable and does not appear here.
message ProductUpdateRequest {
  message Options {
    optional google.protobuf.FieldMask updateMask = 1;
    optional string etag = 2;
  }
  string id = 1;
  optional crm.types.common.LocalizedString name = 2;
  optional crm.types.common.LocalizedString description = 3;
  optional string brandId = 4;
  repeated string categoryIds = 5;
  map<string, crm.types.common.LocalizedString> details = 6;
  optional ProductStatus status = 8;
  optional Options options = 99;
}

message ProductUpdateResponse {
  Product product = 1;
}

message ProductDeleteRequest {
  message Options {
    optional string etag = 1;
  }
  string id = 1;
  optional Options options = 99;
}

message ProductDeleteResponse {}
