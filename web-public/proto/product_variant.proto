syntax = "proto3";
package crm.grpc.product_variant.v1;

import "google/protobuf/field_mask.proto";
import "common.proto";

// Mirrors proto/services/grpc/product_variant/v1/product_variant_service.proto
// and proto/types/product_variant/product_variant.proto on the backend.
// ProductVariant is the purchasable unit of a Product — one sku, one set
// of images, its own price (ProductPrice) and stock (Inventory), both
// keyed by variantId.

message ProductVariant {
  string id = 1;
  int64 createdAt = 2;
  int64 updatedAt = 3;
  optional int64 deletedAt = 4;
  string productId = 5;
  string sku = 6;
  // Characteristic name -> localized value, differentiating this variant
  // from its siblings (color, size, ...).
  map<string, crm.types.common.LocalizedString> attributes = 7;
  // Display order; first is main.
  repeated string imageIds = 8;
  ProductVariantStatus status = 9;
  string etag = 101;
}

enum ProductVariantStatus {
  PRODUCT_VARIANT_STATUS_UNSPECIFIED = 0;
  PRODUCT_VARIANT_STATUS_DRAFT = 1;
  PRODUCT_VARIANT_STATUS_ACTIVE = 2;
  PRODUCT_VARIANT_STATUS_INACTIVE = 3;
}

service ProductVariantsService {
  rpc Create (ProductVariantCreateRequest) returns (ProductVariantCreateResponse) {}
  rpc Get (ProductVariantGetRequest) returns (ProductVariantGetResponse) {}
  rpc List (ProductVariantsListRequest) returns (ProductVariantsListResponse) {}
  rpc Update (ProductVariantUpdateRequest) returns (ProductVariantUpdateResponse) {}
  rpc Delete (ProductVariantDeleteRequest) returns (ProductVariantDeleteResponse) {}
}

message ProductVariantGetRequest {
  message Options {
    optional google.protobuf.FieldMask readMask = 1;
  }
  string id = 1;
  optional Options options = 99;
}

message ProductVariantGetResponse {
  ProductVariant variant = 1;
}

message ProductVariantsListRequest {
  optional string productId = 1;
  message Sort {
    enum Field {
      FIELD_CREATED_AT = 0;
      FIELD_SKU = 1;
    }
    Field field = 1;
    crm.types.common.SortDirection direction = 2;
  }
  optional Sort sort = 2;
  optional crm.types.common.Pagination pagination = 3;
  message Filter {
    repeated ProductVariantStatus statuses = 1;
    repeated string productIds = 2;
    repeated string skus = 3;
    optional crm.types.common.PeriodFilter createdAt = 4;
  }
  optional Filter filter = 4;
  message Options {
    optional google.protobuf.FieldMask readMask = 1;
    bool includeTotalCount = 2;
  }
  optional Options options = 99;
}

message ProductVariantsListResponse {
  repeated ProductVariant items = 1;
  optional int64 total = 2;
  optional string nextCursor = 3;
}

message ProductVariantCreateRequest {
  message Options {
    optional google.protobuf.FieldMask readMask = 1;
  }
  string productId = 1;
  string sku = 2;
  map<string, crm.types.common.LocalizedString> attributes = 3;
  optional Options options = 99;
}

message ProductVariantCreateResponse {
  ProductVariant variant = 1;
}

// sku is immutable and does not appear here.
message ProductVariantUpdateRequest {
  message Options {
    optional google.protobuf.FieldMask updateMask = 1;
    optional string etag = 2;
  }
  string id = 1;
  map<string, crm.types.common.LocalizedString> attributes = 2;
  // Full replacement, in display order; applied only when "imageIds" is in
  // options.updateMask (a repeated field has no wire-level presence).
  repeated string imageIds = 3;
  optional ProductVariantStatus status = 4;
  optional Options options = 99;
}

message ProductVariantUpdateResponse {
  ProductVariant variant = 1;
}

message ProductVariantDeleteRequest {
  message Options {
    optional string etag = 1;
  }
  string id = 1;
  optional Options options = 99;
}

message ProductVariantDeleteResponse {}
