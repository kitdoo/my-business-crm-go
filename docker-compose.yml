# Bounded JSON-file logging for every service — restart: unless-stopped
# plus JSON logs to stdout with no rotation will otherwise fill the disk
# on a long-running VM. Not an "environment:" entry, so bare passthrough
# doesn't apply here — needs an actual value, hence ${VAR:-default}.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-5}"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    logging: *default-logging
    # Loads every KEY=VALUE line straight from .env into the container's
    # environment — no need to list each name here, and no compose-level
    # validation (see .env.docker-compose.example for what mongo expects).
    env_file:
      - .env
    volumes:
      - mongo_data:/data/db
    # Temporary: published to localhost only for Compass access via SSH
    # tunnel. Remove this once done — see comment history for why it's
    # normally left unpublished (mass-scan exposure risk on a cloud VM).
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis_data:/data
    # No published port — same rationale as mongo above.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # image is used by `docker compose pull`/`up` as-is (this is what the
    # VM does — it never builds); `build:` is only consulted by `docker
    # compose build` / `up --build`, e.g. on a dev machine with the repo
    # checked out. Images are published by .github/workflows/
    # docker-publish.yml on every vX.Y.Z git tag. IMAGE_TAG defaults to
    # "latest" — pin it to a specific version to control what a `pull`
    # picks up instead of always tracking the newest tagged release.
    image: ghcr.io/kitdoo/my-business-crm-go:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: my-business-crm
        APP_VERSION: ${APP_VERSION:-dev}
        APP_VERSION_COMMIT: ${APP_VERSION_COMMIT:-local}
    restart: unless-stopped
    logging: *default-logging
    command: ["server", "run", "-c", "/app/configs"]
    volumes:
      - ./configs:/app/configs:ro
      # Product images (internal/transports/http/handlers/image) are
      # written under CRM__IMAGES__DIR below. Without a volume here they
      # live only in the container's writable layer and are lost on
      # `docker compose down`, a rebuild, or any container recreate.
      - backend_images:/var/images
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No published ports: gRPC (7779) and the image-upload/serve HTTP
    # port (9080) are reached by web/web-public over the compose-internal
    # network only. Several RPCs are intentionally anonymous (see
    # internal/transports/grpc/interceptors/auth.New) on the assumption
    # that the gRPC port is never reachable from outside the two Nitro
    # BFFs — publishing it to the host on a cloud VM would break that
    # assumption (doubly so with GRPC__REFLECTION enabled below, which
    # makes the whole API trivially enumerable).
    healthcheck:
      # readyz (not healthz): web/web-public's depends_on below waits on
      # this, so it needs to reflect "can actually serve requests"
      # (mongo/redis reachable), not just "process is alive".
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9080/internal/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Loads every KEY=VALUE line straight from .env into the container's
    # environment — no need to list each name here. Names in .env match
    # the app's own CRM__/GRPC__/... config keys directly (double
    # underscore = nested config); the backend validates its own config
    # at startup and fails fast on missing required fields (see
    # internal/pkg/appconfig), so there's no compose-level `:?` here.
    env_file:
      - .env

  web:
    # See the comment on backend's image/build above.
    image: ghcr.io/kitdoo/my-business-crm-go-web:${IMAGE_TAG:-latest}
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    # Unlike backend (which validates its own config and fails fast on
    # missing required fields), the Nuxt apps do no such validation
    # themselves — so required-ness is enforced here with `:?` instead of
    # bare passthrough.
    environment:
      # Nuxt/Nitro built-in runtimeConfig key — overridable at container
      # start with no rebuild, so a single-domain deployment (web-public on
      # "/" and this app reverse-proxied under "/admin/" by nginx, see
      # docker-compose comment above web-public) is purely a nginx+.env
      # change. Defaults to "/" (this app owns the whole host) when unset.
      NUXT_APP_BASE_URL: ${NUXT_APP_BASE_URL:-/}
      NUXT_GRPC_BASE_URL: ${NUXT_GRPC_BASE_URL:-backend:7779}
      NUXT_GRPC_TIMEOUT_MS: ${NUXT_GRPC_TIMEOUT_MS:-15000}
      NUXT_IMAGES_BASE_URL: ${NUXT_IMAGES_BASE_URL:-http://backend:9080}
      NUXT_IMAGES_MAX_SIZE_BYTES: ${NUXT_IMAGES_MAX_SIZE_BYTES:-10485760}
      NUXT_SESSION_SECRET: ${NUXT_SESSION_SECRET:?NUXT_SESSION_SECRET must be set}
      NUXT_SESSION_TTL_SECONDS: ${NUXT_SESSION_TTL_SECONDS:-43200}

  web-public:
    # See the comment on backend's image/build above.
    image: ghcr.io/kitdoo/my-business-crm-go-web-public:${IMAGE_TAG:-latest}
    build:
      context: ./web-public
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PUBLIC_PORT:-3001}:3000"
    # Unlike backend (which validates its own config and fails fast on
    # missing required fields), the Nuxt apps do no such validation
    # themselves — so required-ness is enforced here with `:?` instead of
    # bare passthrough. NUXT_GRPC_CLIENT_KEY is the one intentional
    # exception: it must match one of the values under
    # CRM__NOTIFICATION_CLIENTS__* on the backend (see
    # .env.docker-compose.example), but left unset, the contact/dealer
    # forms just fail at submit time with a clear error instead of
    # blocking startup — so it defaults to empty rather than `:?`.
    environment:
      NUXT_GRPC_BASE_URL: ${NUXT_GRPC_BASE_URL:-backend:7779}
      NUXT_GRPC_TIMEOUT_MS: ${NUXT_GRPC_TIMEOUT_MS:-15000}
      NUXT_GRPC_CLIENT_KEY: ${NUXT_GRPC_CLIENT_KEY:-}
      NUXT_IMAGES_BASE_URL: ${NUXT_IMAGES_BASE_URL:-http://backend:9080}
      NUXT_PUBLIC_ADMIN_URL: ${NUXT_PUBLIC_ADMIN_URL:-http://localhost:3000/login}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3001}

volumes:
  mongo_data:
  redis_data:
  backend_images:
