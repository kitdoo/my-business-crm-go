syntax = "proto3";
package crm.grpc.product_sku.v1;

import "google/protobuf/field_mask.proto";
import "buf/validate/validate.proto";
import "types/common/common_localized_string.proto";
import "types/common/common_pagination.proto";
import "types/common/common_period_filter.proto";
import "types/common/common_sort_direction.proto";
import "types/product_sku/product_sku.proto";

option go_package = ".;productskupb";

service ProductSKUsService {
  rpc Create (ProductSKUCreateRequest) returns (ProductSKUCreateResponse) {}
  rpc Get (ProductSKUGetRequest) returns (ProductSKUGetResponse) {}
  rpc List (ProductSKUsListRequest) returns (ProductSKUsListResponse) {}
  rpc Update (ProductSKUUpdateRequest) returns (ProductSKUUpdateResponse) {}
  rpc Delete (ProductSKUDeleteRequest) returns (ProductSKUDeleteResponse) {}
}

message ProductSKUGetRequest {
  message Options {
    optional google.protobuf.FieldMask readMask = 1;
  }
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  optional Options options = 99;
}

message ProductSKUGetResponse {
  crm.types.product_sku.ProductSKU sku = 1;
}

message ProductSKUsListRequest {
  optional string variantId = 1 [(buf.validate.field).string.uuid = true];
  message Sort {
    enum Field {
      FIELD_CREATED_AT = 0;
      FIELD_SKU = 1;
    }
    Field field = 1 [(buf.validate.field).enum.defined_only = true];
    crm.types.common.SortDirection direction = 2;
  }
  optional Sort sort = 2;
  optional crm.types.common.Pagination pagination = 3;
  message Filter {
    repeated crm.types.product_sku.ProductSkuStatus statuses = 1 [(buf.validate.field).repeated.unique = true];
    repeated string variantIds = 2 [(buf.validate.field).repeated.items.string.uuid = true];
    repeated string skus = 3;
    optional crm.types.common.PeriodFilter createdAt = 4;
  }
  optional Filter filter = 4;
  message Options {
    optional google.protobuf.FieldMask readMask = 1;
    bool includeTotalCount = 2;
  }
  optional Options options = 99;
}

message ProductSKUsListResponse {
  repeated crm.types.product_sku.ProductSKU items = 1;
  optional int64 total = 2;
  optional string nextCursor = 3;
}

message ProductSKUCreateRequest {
  message Options {
    optional google.protobuf.FieldMask readMask = 1;
  }
  string variantId = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string sku = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1, (buf.validate.field).string.max_len = 64];
  map<string, crm.types.common.LocalizedString> attributes = 3;
  optional Options options = 99;
}

message ProductSKUCreateResponse {
  crm.types.product_sku.ProductSKU sku = 1;
}

// sku is immutable and does not appear here.
message ProductSKUUpdateRequest {
  message Options {
    optional google.protobuf.FieldMask updateMask = 1;
    optional string etag = 2;
  }
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  map<string, crm.types.common.LocalizedString> attributes = 2;
  optional crm.types.product_sku.ProductSkuStatus status = 3 [(buf.validate.field).enum.defined_only = true];
  optional Options options = 99;
}

message ProductSKUUpdateResponse {
  crm.types.product_sku.ProductSKU sku = 1;
}

message ProductSKUDeleteRequest {
  message Options {
    optional string etag = 1;
  }
  string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  optional Options options = 99;
}

message ProductSKUDeleteResponse {}
