syntax = "proto3";
package crm.types.price;

option go_package = "github.com/kitdoo/my-business-crm-go/proto/gen/go/types/price;pricepb";

message ProductPrice {
  string id = 1;
  int64 createdAt = 2;
  int64 updatedAt = 3;
  optional int64 deletedAt = 4;
  string variantId = 5;
  // Basis points (amount * 100).
  int64 priceAmount = 6;
  // ISO 4217 code, e.g. "RSD". Not settable via Create/Update.
  string currency = 7;
  optional int64 discountAmount = 8;
  string etag = 101;
}
