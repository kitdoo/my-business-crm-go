syntax = "proto3";
package crm.types.partner;

option go_package = "github.com/kitdoo/my-business-crm-go/proto/gen/go/types/partner;partnerpb";

message Partner {
  string id = 1;
  int64 createdAt = 2;
  int64 updatedAt = 3;
  optional int64 deletedAt = 4;
  string name = 5;
  string phone = 6;
  string email = 7;
  // Payout percentage when this partner refers a client's sale (Sale has
  // both clientId and partnerId) — applied to Sale.totalAmount as a
  // commission owed to the partner, never as a discount to the client.
  int32 commissionPercentage = 8;
  string note = 9;
  PartnerStatus status = 10;
  string address = 11;
  string website = 12;
  // Discount percentage when this partner buys directly (Sale has
  // partnerId but no clientId) — applied automatically to every item's
  // discountPercentage, overriding whatever the caller sent.
  int32 discountPercentage = 13;
  // Whether this partner appears in PartnersService.ListPublic (the
  // public website's dealer-network listing). false hides it there while
  // remaining fully visible/usable in the admin.
  bool isPublic = 14;
  // Distinguishes an existing store carrying PHOMI as one of several brands
  // (PARTNER) from a store opening specifically as a PHOMI-branded outlet
  // under separate terms (DEALER). Purely descriptive — does not change how
  // commissionPercentage/discountPercentage are applied.
  PartnerType type = 15;
  // ПИБ and матични број — identify this partner's legal entity, e.g. for
  // invoicing. Optional.
  string taxId = 16;
  string registrationNumber = 17;
  // Short, caller-assigned buyer reference (e.g. "0003") shown on
  // invoices — free text, never auto-generated.
  string code = 18;
  string etag = 101;
}

enum PartnerStatus {
  PARTNER_STATUS_UNSPECIFIED = 0;
  PARTNER_STATUS_ACTIVE = 1;
  PARTNER_STATUS_INACTIVE = 2;
}

enum PartnerType {
  PARTNER_TYPE_UNSPECIFIED = 0;
  PARTNER_TYPE_PARTNER = 1;
  PARTNER_TYPE_DEALER = 2;
}
