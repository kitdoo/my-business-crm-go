syntax = "proto3";
package crm.types.inventory;

option go_package = "github.com/kitdoo/my-business-crm-go/proto/gen/go/types/inventory;inventorypb";

// Read-only — see InventoryMovementsService for writes.
// Unique per (productId, warehouseId).
message Inventory {
  string id = 1;
  int64 updatedAt = 2;
  string productId = 3;
  string warehouseId = 4;
  int64 quantity = 5;
  string etag = 101;
}
