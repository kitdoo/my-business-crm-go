syntax = "proto3";
package crm.types.sale;

option go_package = "github.com/kitdoo/my-business-crm-go/proto/gen/go/types/sale;salepb";

// Items are immutable once created — reverse a mistake with Cancel.
message Sale {
  reserved 6;
  reserved "warehouseId";
  string id = 1;
  int64 createdAt = 2;
  int64 updatedAt = 3;
  optional int64 deletedAt = 4;
  // Empty when this sale's only counterparty is partnerId (the partner
  // bought directly) — see SaleCreateRequest for the three valid
  // combinations of clientId/partnerId.
  optional string clientId = 5;
  optional string partnerId = 7;
  repeated SaleItem items = 8;
  // Basis points, sum of item lines after discount.
  int64 totalAmount = 9;
  SaleStatus status = 10;
  string createdBy = 11;
  // Human-readable, sequential — assigned atomically on Create (never
  // client-supplied). Not a substitute for id: still the join key
  // everywhere else, this is display-only.
  int64 number = 12;
  string etag = 101;
}

message SaleItem {
  string skuId = 1;
  int64 quantity = 2;
  int64 priceAmount = 3;
  // Always 0-100, never a fixed amount.
  int32 discountPercentage = 4;
  // Each item is fulfilled from its own warehouse.
  string warehouseId = 5;
}

enum SaleStatus {
  SALE_STATUS_UNSPECIFIED = 0;
  SALE_STATUS_DRAFT = 1;
  SALE_STATUS_PAID = 2;
  SALE_STATUS_SHIPPED = 3;
  SALE_STATUS_COMPLETED = 4;
  SALE_STATUS_CANCELLED = 5;
  SALE_STATUS_REFUNDED = 6;
}
