syntax = "proto3";
package crm.types.sale;

option go_package = "github.com/kitdoo/my-business-crm-go/proto/gen/go/types/sale;salepb";

// Items are immutable once created — reverse a mistake with Cancel.
message Sale {
  string id = 1;
  int64 createdAt = 2;
  int64 updatedAt = 3;
  optional int64 deletedAt = 4;
  string clientId = 5;
  // Fulfilled from exactly one warehouse.
  string warehouseId = 6;
  optional string partnerId = 7;
  repeated SaleItem items = 8;
  // Basis points, sum of item lines after discount.
  int64 totalAmount = 9;
  SaleStatus status = 10;
  string createdBy = 11;
  string etag = 101;
}

message SaleItem {
  string productId = 1;
  int64 quantity = 2;
  int64 priceAmount = 3;
  // Always 0-100, never a fixed amount.
  int32 discountPercentage = 4;
}

enum SaleStatus {
  SALE_STATUS_UNSPECIFIED = 0;
  SALE_STATUS_DRAFT = 1;
  SALE_STATUS_PAID = 2;
  SALE_STATUS_SHIPPED = 3;
  SALE_STATUS_COMPLETED = 4;
  SALE_STATUS_CANCELLED = 5;
  SALE_STATUS_REFUNDED = 6;
}
