syntax = "proto3";
package crm.types.client;

option go_package = "github.com/kitdoo/my-business-crm-go/proto/gen/go/types/client;clientpb";

// name/address/note are factual data, not localized.
message Client {
  string id = 1;
  int64 createdAt = 2;
  int64 updatedAt = 3;
  optional int64 deletedAt = 4;
  string name = 5;
  string phone = 6;
  string email = 7;
  string address = 8;
  string note = 9;
  string etag = 101;
}
