syntax = "proto3";
package crm.types.client;

option go_package = "github.com/kitdoo/my-business-crm-go/proto/gen/go/types/client;clientpb";

// name/address/note are factual data, not localized.
message Client {
  string id = 1;
  int64 createdAt = 2;
  int64 updatedAt = 3;
  optional int64 deletedAt = 4;
  string name = 5;
  string phone = 6;
  string email = 7;
  string address = 8;
  string note = 9;
  // ПИБ and матични број — identify a client that is itself a legal
  // entity/sole proprietor, e.g. for invoicing. Both optional and blank
  // for an ordinary retail client.
  string taxId = 10;
  string registrationNumber = 11;
  // Short, caller-assigned buyer reference (e.g. "0003") shown on
  // invoices — free text, never auto-generated.
  string code = 12;
  string etag = 101;
}
