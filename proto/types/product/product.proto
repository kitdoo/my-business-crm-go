syntax = "proto3";
package crm.types.product;

import "types/common/common_localized_string.proto";

option go_package = "github.com/kitdoo/my-business-crm-go/proto/gen/go/types/product;productpb";

// Product is a catalog card grouping one or more ProductVariant — it
// carries no sku, images, price, or stock; those live on ProductVariant
// (sku, imageIds) and, per variant, on ProductPrice and Inventory. A
// product is not itself purchasable — see ProductVariant.
message Product {
  reserved 5, 11;
  reserved "sku", "imageIds";

  string id = 1;
  int64 createdAt = 2;
  int64 updatedAt = 3;
  optional int64 deletedAt = 4;
  crm.types.common.LocalizedString name = 6;
  crm.types.common.LocalizedString description = 7;
  string brandId = 8;
  repeated string categoryIds = 9;
  // Characteristic name -> localized value, shared across every variant
  // (material, collection, ...). Variant-differentiating characteristics
  // (color, size, ...) live on ProductVariant.attributes instead.
  map<string, crm.types.common.LocalizedString> details = 10;
  ProductStatus status = 12;
  // Unit the SKU price is quoted per (piece/board vs square meter) — shown
  // next to the price on the public site. Almost every product is priced
  // per piece; a few (e.g. facing brick) are priced per m² instead, which
  // used to be a source of confusion since ProductPrice itself carries no
  // unit of its own.
  PriceUnit priceUnit = 13;
  string etag = 101;
}

enum ProductStatus {
  PRODUCT_STATUS_UNSPECIFIED = 0;
  PRODUCT_STATUS_DRAFT = 1;
  PRODUCT_STATUS_ACTIVE = 2;
  PRODUCT_STATUS_INACTIVE = 3;
}

enum PriceUnit {
  PRICE_UNIT_UNSPECIFIED = 0;
  PRICE_UNIT_PIECE = 1;
  PRICE_UNIT_SQUARE_METER = 2;
}
