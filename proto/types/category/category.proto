syntax = "proto3";
package crm.types.category;

import "types/common/common_localized_string.proto";

option go_package = "github.com/kitdoo/my-business-crm-go/proto/gen/go/types/category;categorypb";

// Categories are peers, not a hierarchy at all — a product may belong to
// several at once, and there is no parent/child relationship between
// categories.
message Category {
  reserved 7;
  reserved "parentId";

  string id = 1;
  int64 createdAt = 2;
  int64 updatedAt = 3;
  optional int64 deletedAt = 4;
  crm.types.common.LocalizedString name = 5;
  crm.types.common.LocalizedString description = 6;
  CategoryStatus status = 8;
  string etag = 101;
}

enum CategoryStatus {
  CATEGORY_STATUS_UNSPECIFIED = 0;
  CATEGORY_STATUS_ACTIVE = 1;
  CATEGORY_STATUS_INACTIVE = 2;
}
