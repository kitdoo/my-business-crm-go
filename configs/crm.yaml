# CRM business-domain configuration.
# Defines the bootstrap admin account, RBAC permission table, and the
# system-wide currency.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#crm:
#  # <string> ISO 4217 code the whole system prices in. Defaults to "RSD"
#  # when this section (or just this field) is absent.
#  currency: "RSD"
