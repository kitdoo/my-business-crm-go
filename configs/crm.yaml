# CRM business-domain configuration.
# Defines the bootstrap admin account, RBAC permission table, session-token
# signing, the system-wide currency, and the product-image upload endpoint.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#crm:
#  # <string> ISO 4217 code the whole system prices in.
#  # Default value: "RSD"
#  currency: "RSD"
#
#  # <object> Session-token signing for User Login/Authenticate.
#  auth:
#    # <string> HMAC-SHA256 secret used to sign and verify session tokens.
#    # Default value: not set (required)
#    signingKey: "change-me-before-boot"
#
#    # <duration> How long a session token stays valid after Login.
#    # Default value: 72h
#    tokenTTL: "72h"
#
#  # <object> Created on first boot if no user with this phone/email exists yet.
#  bootstrapAdmin:
#    name: "Admin"
#    phone: "+000000000000"
#    email: "admin@example.com"
#    password: "change-me-before-boot"
#
#  # <map<string, []string>> Role -> permission strings ("*" grants
#  # everything for that role).
#  rbac:
#    admin:
#      - "*"
#    employee:
#      - "products:read"
#      - "products:create"
#      - "productvariants:read"
#      - "productvariants:create"
#      - "productskus:read"
#      - "productskus:create"
#      - "images:upload"
#      - "categories:read"
#      - "categories:create"
#      - "brands:read"
#      - "brands:create"
#      - "sales:create"
#    guest: []
#
#  # <object> Product-image upload endpoint (plain HTTP, not gRPC).
#  images:
#    # <string> Directory files are saved under, one per id.
#    # Default value: "<var-dir>/images"
#    dir: "/var/lib/my-business-crm/images"
#
#    # <int> Max accepted upload size in bytes.
#    # Default value: 10485760 (10 MiB)
#    maxSizeBytes: 10485760
#
#  # <object> Outbound SMTP for NotificationsService.Send (generic
#  # message sender used by web-public/'s contact/dealer forms, and any
#  # other approved caller — see notificationClients below). Optional —
#  # when absent, Send fails with an explicit error instead of silently
#  # doing nothing.
#  smtp:
#    # <string> SMTP server hostname.
#    host: "smtp.gmail.com"
#
#    # <int> SMTP server port. 587 (STARTTLS) and 465 (implicit TLS) are
#    # both supported.
#    # Default value: 587
#    port: 587
#
#    # <string> SMTP auth username. Leave unset to disable auth.
#    username: "you@example.com"
#
#    # <string> SMTP auth password (app password for Gmail/etc).
#    password: "change-me-before-boot"
#
#    # <string> From address emails are sent as.
#    from: "no-reply@example.com"
#
#    # <string> Recipient every message is delivered to.
#    to: "sales@example.com"
#
#  # <map<string, string>> Client name (for audit logging) -> static API
#  # key. A caller of NotificationsService.Send must present one of these
#  # keys via the "x-client-key" gRPC metadata header; an absent/empty map
#  # denies every caller (fail closed). Each approved frontend (web-public/,
#  # future others) gets its own entry so a leaked key can be identified
#  # and rotated without affecting the others.
#  notificationClients:
#    web-public: "change-me-before-boot"
