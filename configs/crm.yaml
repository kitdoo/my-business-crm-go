# CRM business-domain configuration.
# Defines the bootstrap admin account, RBAC permission table, session-token
# signing, the system-wide currency, and the product-image upload endpoint.
# All parameters are commented out by default (template mode).
# Uncomment and configure as needed for your environment.

#crm:
#  # <string> ISO 4217 code the whole system prices in.
#  # Default value: "RSD"
#  currency: "RSD"
#
#  # <object> Session-token signing for User Login/Authenticate.
#  auth:
#    # <string> HMAC-SHA256 secret used to sign and verify session tokens.
#    # Default value: not set (required)
#    signingKey: "change-me-before-boot"
#
#    # <duration> How long a session token stays valid after Login.
#    # Default value: 72h
#    tokenTTL: "72h"
#
#  # <object> Created on first boot if no user with this phone/email exists yet.
#  bootstrapAdmin:
#    name: "Admin"
#    phone: "+000000000000"
#    email: "admin@example.com"
#    password: "change-me-before-boot"
#
#  # <map<string, []string>> Role -> permission strings ("*" grants
#  # everything for that role).
#  #
#  # employee: read access to the whole catalog except users (those extra
#  # reads back relation lookups elsewhere, e.g. a product card showing
#  # its brand name — see web/app/config/navigation.js ROLE_MENU_KEYS for
#  # the curated menu subset built on top of this), plus the only
#  # mutation employees get: creating/editing sales.
#  #
#  # guest: the same full read access, no mutations at all — every
#  # create/update/delete control in the UI stays hidden (gated through
#  # web/app/composables/usePermission.js can()).
#  rbac:
#    admin:
#      - "*"
#    employee:
#      - "brands:read"
#      - "categories:read"
#      - "clients:read"
#      - "inventory:read"
#      - "inventorymovements:read"
#      - "partners:read"
#      - "prices:read"
#      - "products:read"
#      - "productattributedefinitions:read"
#      - "productvariants:read"
#      - "productskus:read"
#      - "reports:read"
#      - "sales:read"
#      - "sales:create"
#      - "sales:update"
#      - "invoices:generate"
#      - "salesreport:generate"
#      - "warehouses:read"
#    guest:
#      - "brands:read"
#      - "categories:read"
#      - "clients:read"
#      - "inventory:read"
#      - "inventorymovements:read"
#      - "partners:read"
#      - "prices:read"
#      - "products:read"
#      - "productattributedefinitions:read"
#      - "productvariants:read"
#      - "productskus:read"
#      - "reports:read"
#      - "sales:read"
#      - "users:read"
#      - "warehouses:read"
#
#  # <object> Product-image upload endpoint (plain HTTP, not gRPC).
#  images:
#    # <string> Directory files are saved under, one per id.
#    # Default value: "<var-dir>/images"
#    dir: "/var/lib/my-business-crm/images"
#
#    # <int> Max accepted upload size in bytes.
#    # Default value: 10485760 (10 MiB)
#    maxSizeBytes: 10485760
#
#  # <object> Outbound SMTP for NotificationsService.Send (generic
#  # message sender used by web-public/'s contact/dealer forms, and any
#  # other approved caller — see notificationClients below). Optional —
#  # when absent, Send fails with an explicit error instead of silently
#  # doing nothing.
#  smtp:
#    # <string> SMTP server hostname.
#    host: "smtp.gmail.com"
#
#    # <int> SMTP server port. 587 (STARTTLS) and 465 (implicit TLS) are
#    # both supported.
#    # Default value: 587
#    port: 587
#
#    # <string> SMTP auth username. Leave unset to disable auth.
#    username: "you@example.com"
#
#    # <string> SMTP auth password (app password for Gmail/etc).
#    password: "change-me-before-boot"
#
#    # <string> From address emails are sent as.
#    from: "no-reply@example.com"
#
#    # <string> Recipient every message is delivered to.
#    to: "sales@example.com"
#
#  # <map<string, string>> Client name (for audit logging) -> static API
#  # key. A caller of NotificationsService.Send must present one of these
#  # keys via the "x-client-key" gRPC metadata header; an absent/empty map
#  # denies every caller (fail closed). Each approved frontend (web-public/,
#  # future others) gets its own entry so a leaked key can be identified
#  # and rotated without affecting the others.
#  notificationClients:
#    web-public: "change-me-before-boot"
#
#  # <object> Seller letterhead, commercial terms, and VAT rate used to
#  # render a Sale as an invoice PDF (POST /invoices/{saleId} — see
#  # internal/transports/http/handlers/invoice). Optional: when absent,
#  # invoice generation fails with an explicit error instead of rendering a
#  # blank letterhead.
#  invoice:
#    company:
#      name: "Your Company DOO"
#      # <string> "Mesto izdavanja" (place of issue) — printed after name
#      # on the letterhead and in the document-info box.
#      city: "Novi Sad"
#      address: "Street 1, 21000 Novi Sad"
#      phone: "+381 60 000 0000"
#      email: "info@example.com"
#      taxId: "000000000"
#      registrationNumber: "00000000"
#      # <string> "Šifra delatnosti" printed on the letterhead.
#      activityCode: "0000"
#      bankName: "Your Bank"
#      bankAccount: "000000000000000000"
#      responsiblePerson: "Responsible Person"
#
#    # <string> Prepended to the Sale's own number to build the printed
#    # offer number, e.g. prefix "POKU" + sale number 4 + issue date ->
#    # "POKU_004-13-07-26".
#    numberPrefix: "POKU"
#
#    # <string> Same as numberPrefix, but for the receipt (post-payment
#    # document) — falls back to numberPrefix when unset.
#    receiptNumberPrefix: "RAC"
#
#    terms:
#      # <int> Default value: 100
#      advancePercentage: 100
#      # <string> Free text, e.g. "5-6 radnih dana od datuma prihvatanja
#      # ponude i uplate avansa."
#      deliveryLeadTime: "5-6 radnih dana od datuma prihvatanja ponude i uplate avansa."
#      # <int> Default value: 5
#      offerValidityDays: 5
#
#    # <object> Single system-wide VAT rate applied when an invoice
#    # request sets includeVat=true — there is no per-invoice custom rate.
#    vat:
#      # <int> Default value: 20
#      percentage: 20
