syntax = "proto3";
package crm.grpc.inventory.v1;

import "common.proto";

// Mirrors proto/services/grpc/inventory/v1/inventory_service.proto and
// proto/types/inventory/inventory.proto on the backend. Read-only — stock
// changes only through InventoryMovementsService — so unlike every other
// entity so far, this service (and this file) has no Create/Update/Delete
// at all, not just no permission for them.

message Inventory {
  string id = 1;
  int64 updatedAt = 2;
  string skuId = 3;
  string warehouseId = 4;
  int64 quantity = 5;
  string etag = 101;
}

service InventoryService {
  rpc Get (InventoryGetRequest) returns (InventoryGetResponse) {}
  rpc List (InventoryListRequest) returns (InventoryListResponse) {}
}

message InventoryGetRequest {
  string skuId = 1;
  string warehouseId = 2;
}

message InventoryGetResponse {
  Inventory inventory = 1;
}

message InventoryListRequest {
  optional string skuId = 1;
  optional string warehouseId = 2;
  message Filter {
    optional int64 minQuantity = 1;
    optional int64 maxQuantity = 2;
  }
  optional Filter filter = 3;
  optional crm.types.common.Pagination pagination = 4;
  message Sort {
    enum Field {
      FIELD_QUANTITY = 0;
    }
    Field field = 1;
    crm.types.common.SortDirection direction = 2;
  }
  optional Sort sort = 5;
}

message InventoryListResponse {
  repeated Inventory items = 1;
  optional string nextCursor = 2;
}
