syntax = "proto3";
package crm.grpc.user.v1;

import "common.proto";

// Trimmed mirror of proto/services/grpc/user/v1/user_service.proto —
// only what the BFF login/session flow needs (see docs TD §4.1). Extend
// with Create/Update/Delete/List/ChangePassword when the Users entity
// screens are implemented.

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_ADMIN = 1;
  USER_ROLE_EMPLOYEE = 2;
  USER_ROLE_GUEST = 3;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_INACTIVE = 2;
}

message User {
  string id = 1;
  int64 createdAt = 2;
  int64 updatedAt = 3;
  optional int64 deletedAt = 4;
  crm.types.common.LocalizedString name = 5;
  crm.types.common.LocalizedString lastName = 6;
  string phone = 7;
  string email = 8;
  crm.types.common.LocalizedString description = 9;
  UserRole role = 10;
  UserStatus status = 11;
  string etag = 101;
}

service UsersService {
  rpc Login (UserLoginRequest) returns (UserLoginResponse) {}
}

message UserLoginRequest {
  string login = 1;
  string password = 2;
}

message UserLoginResponse {
  string token = 1;
  User user = 2;
}
