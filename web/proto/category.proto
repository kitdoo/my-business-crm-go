syntax = "proto3";
package crm.grpc.category.v1;

import "google/protobuf/field_mask.proto";
import "common.proto";

// Mirrors proto/services/grpc/category/v1/category_service.proto and
// proto/types/category/category.proto on the backend. Categories are
// peers, not a strict hierarchy — a product may belong to several at once.

message Category {
  string id = 1;
  int64 createdAt = 2;
  int64 updatedAt = 3;
  optional int64 deletedAt = 4;
  crm.types.common.LocalizedString name = 5;
  crm.types.common.LocalizedString description = 6;
  optional string parentId = 7;
  CategoryStatus status = 8;
  string etag = 101;
}

enum CategoryStatus {
  CATEGORY_STATUS_UNSPECIFIED = 0;
  CATEGORY_STATUS_ACTIVE = 1;
  CATEGORY_STATUS_INACTIVE = 2;
}

service CategoriesService {
  rpc Create (CategoryCreateRequest) returns (CategoryCreateResponse) {}
  rpc Get (CategoryGetRequest) returns (CategoryGetResponse) {}
  rpc List (CategoriesListRequest) returns (CategoriesListResponse) {}
  rpc Update (CategoryUpdateRequest) returns (CategoryUpdateResponse) {}
  rpc Delete (CategoryDeleteRequest) returns (CategoryDeleteResponse) {}
}

message CategoryGetRequest {
  message Options {
    optional google.protobuf.FieldMask readMask = 1;
  }
  string id = 1;
  optional Options options = 99;
}

message CategoryGetResponse {
  Category category = 1;
}

message CategoriesListRequest {
  optional string parentId = 1;
  message Sort {
    enum Field {
      FIELD_CREATED_AT = 0;
      FIELD_NAME = 1;
    }
    Field field = 1;
    crm.types.common.SortDirection direction = 2;
  }
  optional Sort sort = 2;
  optional crm.types.common.Pagination pagination = 3;
  message Filter {
    repeated CategoryStatus statuses = 1;
    optional bool hasProducts = 2;
    optional string searchQuery = 3;
    optional crm.types.common.PeriodFilter createdAt = 4;
  }
  optional Filter filter = 4;
  message Options {
    optional google.protobuf.FieldMask readMask = 1;
    bool includeTotalCount = 2;
  }
  optional Options options = 99;
}

message CategoriesListResponse {
  repeated Category items = 1;
  optional int64 total = 2;
  optional string nextCursor = 3;
}

message CategoryCreateRequest {
  message Options {
    optional google.protobuf.FieldMask readMask = 1;
  }
  crm.types.common.LocalizedString name = 1;
  crm.types.common.LocalizedString description = 2;
  optional string parentId = 3;
  optional Options options = 99;
}

message CategoryCreateResponse {
  Category category = 1;
}

message CategoryUpdateRequest {
  message Options {
    optional google.protobuf.FieldMask updateMask = 1;
    optional string etag = 2;
  }
  string id = 1;
  optional crm.types.common.LocalizedString name = 2;
  optional crm.types.common.LocalizedString description = 3;
  optional string parentId = 4;
  optional CategoryStatus status = 5;
  optional Options options = 99;
}

message CategoryUpdateResponse {
  Category category = 1;
}

message CategoryDeleteRequest {
  message Options {
    optional string etag = 1;
  }
  string id = 1;
  optional Options options = 99;
}

message CategoryDeleteResponse {}
