syntax = "proto3";
package crm.grpc.partner.v1;

import "google/protobuf/field_mask.proto";
import "common.proto";

// Mirrors proto/services/grpc/partner/v1/partner_service.proto and
// proto/types/partner/partner.proto on the backend.

message Partner {
  string id = 1;
  int64 createdAt = 2;
  int64 updatedAt = 3;
  optional int64 deletedAt = 4;
  string name = 5;
  string phone = 6;
  string email = 7;
  // Commission applied to Sale.totalAmount, 0-100.
  int32 commissionPercentage = 8;
  string note = 9;
  PartnerStatus status = 10;
  string address = 11;
  string etag = 101;
}

enum PartnerStatus {
  PARTNER_STATUS_UNSPECIFIED = 0;
  PARTNER_STATUS_ACTIVE = 1;
  PARTNER_STATUS_INACTIVE = 2;
}

service PartnersService {
  rpc Create (PartnerCreateRequest) returns (PartnerCreateResponse) {}
  rpc Get (PartnerGetRequest) returns (PartnerGetResponse) {}
  rpc List (PartnersListRequest) returns (PartnersListResponse) {}
  rpc Update (PartnerUpdateRequest) returns (PartnerUpdateResponse) {}
  rpc Delete (PartnerDeleteRequest) returns (PartnerDeleteResponse) {}
}

message PartnerGetRequest {
  message Options {
    optional google.protobuf.FieldMask readMask = 1;
  }
  string id = 1;
  optional Options options = 99;
}

message PartnerGetResponse {
  Partner partner = 1;
}

message PartnersListRequest {
  message Sort {
    enum Field {
      FIELD_CREATED_AT = 0;
      FIELD_NAME = 1;
    }
    Field field = 1;
    crm.types.common.SortDirection direction = 2;
  }
  optional Sort sort = 1;
  optional crm.types.common.Pagination pagination = 2;
  message Filter {
    repeated PartnerStatus statuses = 1;
    optional string searchQuery = 2;
    optional crm.types.common.PeriodFilter createdAt = 3;
  }
  optional Filter filter = 3;
  message Options {
    optional google.protobuf.FieldMask readMask = 1;
    bool includeTotalCount = 2;
  }
  optional Options options = 99;
}

message PartnersListResponse {
  repeated Partner items = 1;
  optional int64 total = 2;
  optional string nextCursor = 3;
}

message PartnerCreateRequest {
  message Options {
    optional google.protobuf.FieldMask readMask = 1;
  }
  string name = 1;
  string phone = 2;
  string email = 3;
  int32 commissionPercentage = 4;
  string note = 5;
  string address = 6;
  optional Options options = 99;
}

message PartnerCreateResponse {
  Partner partner = 1;
}

message PartnerUpdateRequest {
  message Options {
    optional google.protobuf.FieldMask updateMask = 1;
    optional string etag = 2;
  }
  string id = 1;
  optional string name = 2;
  optional string phone = 3;
  optional string email = 4;
  optional int32 commissionPercentage = 5;
  optional string note = 6;
  optional PartnerStatus status = 7;
  optional string address = 8;
  optional Options options = 99;
}

message PartnerUpdateResponse {
  Partner partner = 1;
}

message PartnerDeleteRequest {
  message Options {
    optional string etag = 1;
  }
  string id = 1;
  optional Options options = 99;
}

message PartnerDeleteResponse {}
