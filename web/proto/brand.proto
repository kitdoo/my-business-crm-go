syntax = "proto3";
package crm.grpc.brand.v1;

import "google/protobuf/field_mask.proto";
import "common.proto";

// Mirrors proto/services/grpc/brand/v1/brand_service.proto and
// proto/types/brand/brand.proto on the backend. See proto/common.proto for
// the note on why buf.validate annotations were dropped here.

message Brand {
  string id = 1;
  int64 createdAt = 2;
  int64 updatedAt = 3;
  optional int64 deletedAt = 4;
  crm.types.common.LocalizedString name = 5;
  crm.types.common.LocalizedString description = 6;
  BrandStatus status = 7;
  string etag = 101;
}

enum BrandStatus {
  BRAND_STATUS_UNSPECIFIED = 0;
  BRAND_STATUS_ACTIVE = 1;
  BRAND_STATUS_INACTIVE = 2;
}

service BrandsService {
  rpc Create (BrandCreateRequest) returns (BrandCreateResponse) {}
  rpc Get (BrandGetRequest) returns (BrandGetResponse) {}
  rpc List (BrandsListRequest) returns (BrandsListResponse) {}
  rpc Update (BrandUpdateRequest) returns (BrandUpdateResponse) {}
  rpc Delete (BrandDeleteRequest) returns (BrandDeleteResponse) {}
}

message BrandGetRequest {
  message Options {
    optional google.protobuf.FieldMask readMask = 1;
  }
  string id = 1;
  optional Options options = 99;
}

message BrandGetResponse {
  Brand brand = 1;
}

message BrandsListRequest {
  message Sort {
    enum Field {
      FIELD_CREATED_AT = 0;
      FIELD_NAME = 1;
    }
    Field field = 1;
    crm.types.common.SortDirection direction = 2;
  }
  optional Sort sort = 1;
  optional crm.types.common.Pagination pagination = 2;
  message Filter {
    repeated BrandStatus statuses = 1;
    optional string searchQuery = 2;
    optional crm.types.common.PeriodFilter createdAt = 3;
  }
  optional Filter filter = 3;
  message Options {
    optional google.protobuf.FieldMask readMask = 1;
    bool includeTotalCount = 2;
  }
  optional Options options = 99;
}

message BrandsListResponse {
  repeated Brand items = 1;
  optional int64 total = 2;
  optional string nextCursor = 3;
}

message BrandCreateRequest {
  message Options {
    optional google.protobuf.FieldMask readMask = 1;
  }
  crm.types.common.LocalizedString name = 1;
  crm.types.common.LocalizedString description = 2;
  optional Options options = 99;
}

message BrandCreateResponse {
  Brand brand = 1;
}

message BrandUpdateRequest {
  message Options {
    optional google.protobuf.FieldMask updateMask = 1;
    optional string etag = 2;
  }
  string id = 1;
  optional crm.types.common.LocalizedString name = 2;
  optional crm.types.common.LocalizedString description = 3;
  optional BrandStatus status = 4;
  optional Options options = 99;
}

message BrandUpdateResponse {
  Brand brand = 1;
}

message BrandDeleteRequest {
  message Options {
    optional string etag = 1;
  }
  string id = 1;
  optional Options options = 99;
}

message BrandDeleteResponse {}
